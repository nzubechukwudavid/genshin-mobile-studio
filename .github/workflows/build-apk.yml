name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies & Build Web Assets
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Install Capacitor & Setup Android Platform
        run: |
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
          rm -f capacitor.config.ts
          npx cap add android
          npx cap sync android
          node scripts/configure-android.js

      - name: Build Debug APK with Gradle
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAutoEditor-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
